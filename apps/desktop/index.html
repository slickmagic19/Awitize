<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awitize</title>
    <!-- Brand typefaces for the theme presets; the CSS stacks fall back to
         system fonts when offline, so the app never waits on the network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" />
    <script>
      // Paint the saved theme before first frame — no blue flash on relaunch.
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('aw-theme') || '"awitize"'); } catch (e) { /* default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
